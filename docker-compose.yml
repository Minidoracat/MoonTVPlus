services:
  moontvplus-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: moontvplus-custom:local
    container_name: moontvplus-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    env_file:
      - ./.env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_STORAGE_TYPE: kvrocks
      KVROCKS_URL: redis://moontvplus-kvrocks:6666
      OFFLINE_DOWNLOAD_DIR: /data
    volumes:
      - ./data/downloads:/data
    depends_on:
      - moontvplus-kvrocks
    networks:
      - default
      - moontv-shared

  moontvplus-kvrocks:
    image: apache/kvrocks:latest
    container_name: moontvplus-kvrocks
    restart: unless-stopped
    # 只綁 loopback：讓 host 上的 `pnpm dev` 能連同一份資料，
    # 免得每次改動都要 docker rebuild（~180s）才能驗證。
    ports:
      - "127.0.0.1:6666:6666"
    volumes:
      - moontvplus-kvrocks-data:/var/lib/kvrocks

volumes:
  moontvplus-kvrocks-data:

networks:
  moontv-shared:
    name: moontv-shared
